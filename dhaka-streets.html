 const s=Math.sin(clock*sp*1.6)*.7*Math.abs(m),h=ply.h;h.l.rotation.x=s;h.r.rotation.x=-s;h.al.rotation.x=-s;h.ar.rotation.x=s}
function toggle(){if(!started)return;
 if(drv){drv.mode='parked';ply.x=drv.x+Math.cos(drv.a)*2.8;ply.z=drv.z-Math.sin(drv.a)*2.8;ply.a=drv.a;drv.v=0;drv=null;ply.g.visible=true}
 else{let b=null,bd=6;for(const q of V){const d=Math.hypot(q.x-ply.x,q.z-ply.z)-(q.t=='bus'?3:0);if(d<bd){bd=d;b=q}}
  if(b){if(b.mode=='ai')crime('Carjacking!');else if(b.mode=='police'){stars=Math.max(stars,3);lastCrime=clock;toast('You stole a police car! ★'+stars)}b.mode='player';b.v=0;drv=b;ply.g.visible=false}}}
function clearCops(){for(let i=V.length-1;i>=0;i--)if(V[i].mode=='police'){scene.remove(V[i].m);V.splice(i,1)}}
function polStep(o,dt){const s=sub(),dx=s.x-o.x,dz=s.z-o.z,d=Math.hypot(dx,dz);o.a+=cl(ang(Math.atan2(dx,dz)-o.a),-2.2*dt,2.2*dt);
 o.v+=((d>7?26+stars*3:3)-o.v)*Math.min(1,1.5*dt);o.x+=Math.sin(o.a)*o.v*dt;o.z+=Math.cos(o.a)*o.v*dt;if(wall(o,o.r)){o.v*=.6;o.a+=o.sg*3*dt}
 const fl=((clock*6)|0)%2;o.m.userData.a.material.color.setHex(fl?0xff2020:0x330000);o.m.userData.b.material.color.setHex(fl?0x001033:0x2060ff);
 const sv=drv?Math.abs(drv.v):(key.KeyW||key.ArrowUp?5:0);if(d<7.5&&sv<4)bustT+=dt/Math.max(1,1)}
function busted(){const f=Math.min(money,150);money-=f;stars=0;clearCops();bustT=0;if(drv){drv.mode='parked';drv.v=0;drv=null;ply.g.visible=true}ply.x=3*S+9.5;ply.z=4*S+16;toast('BUSTED! −Tk '+f)}
/* missions */
const PL=[['Dhanmondi 32',2,2],['Road 27 Café',3,7],['Zigatola Stop',1,7],['Shankar Stand',8,2],['Satmasjid Road',7,8],['Sarobar Gate',6,3],['Science Lab',4,1],['Mirpur Road',5,6]];
const mk=new THREE.Mesh(new THREE.CylinderGeometry(4,4,60,24,1,true),new THREE.MeshBasicMaterial({color:0xffd23f,transparent:true,opacity:.28,depthWrite:false,side:THREE.DoubleSide}));scene.add(mk);
let ms=null;
function newMission(){let a,b;do{a=PL[(R()*PL.length)|0];b=PL[(R()*PL.length)|0]}while(a==b||Math.hypot(a[1]-b[1],a[2]-b[2])*S<150);ms={a,b,st:0,t:170,rw:Math.round((200+Math.hypot(a[1]-b[1],a[2]-b[2])*S*1.2)/50)*50}}
function mTarget(){return ms.st?ms.b:ms.a}
newMission();
/* update */
function update(dt){clock+=dt;
 if(drv)drive(drv,dt);else walk(dt);
 for(const q of V){if(q===drv)continue;if(q.mode=='ai')aiStep(q,dt);else if(q.mode=='police')polStep(q,dt)}
 for(const p of P){if(p.dead){p.dead-=dt;if(p.dead<=0){p.dead=0;p.h.g.rotation.x=0;p.p=R()*W}}else{p.p+=p.d*1.6*dt;if(p.p<0||p.p>W){p.d*=-1;p.p=cl(p.p,0,W)}}
  p.x=p.ax?p.p:p.k*S+p.sd*9.5;p.z=p.ax?p.k*S+p.sd*9.5:p.p;const g=p.h.g;g.position.set(p.x,p.dead?.3:.3,p.z);
  if(!p.dead){g.rotation.y=p.ax?p.d*PI/2:(p.d>0?0:PI);const s=Math.sin(clock*6+p.ph)*.6;p.h.l.rotation.x=s;p.h.r.rotation.x=-s;p.h.al.rotation.x=-s;p.h.ar.rotation.x=s;
   if(drv&&Math.abs(drv.v)>4&&Math.hypot(p.x-drv.x,p.z-drv.z)<2.2){p.dead=8;g.rotation.x=-PI/2;g.position.y=.5;crime('Pedestrian hit!')}}}
 const cops=V.filter(q=>q.mode=='police').length;polT-=dt;
 if(stars>0){if(polT<=0&&cops<Math.min(5,stars+1)){const s=sub(),u=R()<.5,c=cl(Math.round((u?s.x+R()*100-50:s.z+R()*100-50)/S),0,N)*S,e=cl((u?s.z:s.x)+(R()<.5?-1:1)*(90+R()*40),0,W),o=addV('police',u?c+4:e,u?e:c-4,0,'police');o.a=u?0:PI/2;polT=2.5}
  if(clock-lastCrime>30){stars=0;clearCops();toast('Wanted level cleared')}if(bustT>2)busted();if(bustT>0&&!cops)bustT=0}else bustT=0;
 if(cops&&bustT>0){const sv=drv?Math.abs(drv.v):0;if(sv>=4)bustT=Math.max(0,bustT-dt*2)}
 ms.t-=dt;const tg=mTarget(),s=sub(),tx_=tg[1]*S,tz_=tg[2]*S;mk.position.set(tx_,30,tz_);mk.scale.set(1+Math.sin(clock*4)*.06,1,1+Math.sin(clock*4)*.06);
 if(Math.hypot(s.x-tx_,s.z-tz_)<7){if(!ms.st){ms.st=1;toast('Order picked up! Deliver to '+ms.b[0])}else{money+=ms.rw;try{localStorage.setItem('dhk_money',money)}catch(e){}toast('Delivered! +Tk '+ms.rw);newMission()}}
 else if(ms.t<=0){toast('Mission timed out');newMission()}
 for(const q of V){q.m.position.set(q.x,0,q.z);q.m.rotation.y=q.a}
 ply.g.position.set(ply.x,.3,ply.z);ply.g.rotation.y=ply.a;sun.position.set(s.x+60,90,s.z+40);sun.target.position.set(s.x,0,s.z);sky.position.set(s.x,0,s.z);
 if(osc){gn.gain.value=muted?0:(drv?.012+Math.abs(drv.v)/VT[drv.t].top*.03:0);osc.frequency.value=40+(drv?Math.abs(drv.v)*5:0)}}
function camStep(dt){const s=sub();ca+=ang(s.a-ca)*Math.min(1,(drv?3:6)*dt);const d=drv?(drv.t=='bus'?15:9.5):5.2,h=drv?4.6:2.6,k=1-Math.exp(-8*dt);
 cam.position.x+=(s.x-Math.sin(ca)*d-cam.position.x)*k;cam.position.z+=(s.z-Math.cos(ca)*d-cam.position.z)*k;cam.position.y+=(h-cam.position.y)*k;
 if(shake>0){cam.position.x+=(R()-.5)*shake;cam.position.y+=(R()-.5)*shake;shake=Math.max(0,shake-dt*2)}
 cam.lookAt(s.x+Math.sin(ca)*5,1.6,s.z+Math.cos(ca)*5);cam.fov=62+(drv?Math.abs(drv.v)*.35:0);cam.updateProjectionMatrix()}
/* HUD */
const mg=$('mm').getContext('2d');
function hud(){const s=sub(),A=s.a,sn=Math.sin(A),cs=Math.cos(A),z=.5,Pj=(x,y)=>[75+z*(-cs*(x-s.x)+sn*(y-s.z)),75-z*(sn*(x-s.x)+cs*(y-s.z))];
 mg.clearRect(0,0,150,150);mg.save();mg.beginPath();mg.arc(75,75,75,0,2*PI);mg.clip();mg.fillStyle='#1d2631';mg.fillRect(0,0,150,150);
 mg.fillStyle='#2f6f8f';LK.forEach(l=>{const[i,j]=l.split(',').map(Number),cx=(i+.5)*S,cz=(j+.5)*S;mg.beginPath();[[-14,-14],[14,-14],[14,14],[-14,14]].forEach(([a,b],n)=>{const p=Pj(cx+a,cz+b);n?mg.lineTo(p[0],p[1]):mg.moveTo(p[0],p[1])});mg.fill()});
 mg.strokeStyle='#5a6573';mg.lineWidth=RW*z;mg.beginPath();for(let k=0;k<=N;k++){let p=Pj(k*S,0),q=Pj(k*S,W);mg.moveTo(p[0],p[1]);mg.lineTo(q[0],q[1]);p=Pj(0,k*S);q=Pj(W,k*S);mg.moveTo(p[0],p[1]);mg.lineTo(q[0],q[1])}mg.stroke();
 const dot=(x,y,c,r)=>{let p=Pj(x,y),dx=p[0]-75,dy=p[1]-75,d=Math.hypot(dx,dy);if(d>66){p=[75+dx/d*66,75+dy/d*66]}mg.fillStyle=c;mg.beginPath();mg.arc(p[0],p[1],r,0,2*PI);mg.fill()};
 V.forEach(q=>{if(q.mode=='police')dot(q.x,q.z,'#ff4040',3)});const tg=mTarget();dot(tg[1]*S,tg[2]*S,'#ffd23f',5);
 mg.restore();mg.fillStyle='#fff';mg.beginPath();mg.moveTo(75,66);mg.lineTo(81,82);mg.lineTo(75,78);mg.lineTo(69,82);mg.fill();
 $('st').textContent='Tk '+money+'  ·  '+'★'.repeat(stars)+'☆'.repeat(5-stars)+(drv?'  ·  '+Math.round(Math.abs(drv.v)*3.6)+' km/h':'  ·  on foot');
 const tg2=mTarget();$('ms').textContent=(ms.st?'Deliver to ':'Pick up at ')+tg2[0]+' · '+Math.round(Math.hypot(s.x-tg2[1]*S,s.z-tg2[2]*S))+' m · '+Math.max(0,ms.t|0)+' s · Tk '+ms.rw}
/* input + audio */
let ac,osc,gn,muted=false;
function audio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();gn=ac.createGain();osc.type='sawtooth';osc.connect(gn);gn.connect(ac.destination);gn.gain.value=0;osc.start()}catch(e){}}
addEventListener('keydown',e=>{key[e.code]=1;if(e.code=='KeyF'&&!e.repeat)toggle();if(e.code=='KeyM')muted=!muted;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>key[e.code]=0);
document.querySelectorAll('#tc b').forEach(b=>{const k=b.dataset.k,off=()=>{key[k]=0};b.addEventListener('pointerdown',e=>{e.preventDefault();audio();if(k=='KeyF')toggle();else key[k]=1});['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,off))});
$('play').onclick=()=>{$('go').style.display='none';started=true;audio();toast('Press F next to the red car to drive')};
function rs(){ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
cam.position.set(ply.x,3,ply.z-6);
let last=performance.now();
(function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(started)update(dt);else{ply.g.position.set(ply.x,.3,ply.z);for(const q of V){q.m.position.set(q.x,0,q.z);q.m.rotation.y=q.a}}camStep(dt);hud();ren.render(scene,cam);requestAnimationFrame(loop)})(last);
</script></body></html>
